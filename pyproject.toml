[project]
name = "fresh-agent"
version = "0.1.0"
description = "Autonomous coding agent framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.25.1",
    "tree-sitter-language-pack>=0.7.2",
]

[project.scripts]
agent = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
